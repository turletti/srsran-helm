apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "srsran-gnb.fullname" . }}
  labels:
    {{- include "srsran-gnb.labels" . | nindent 4 }}
{{- $sriov := .Values.sriov | default dict }}
{{- $sriovEnabled := $sriov.enabled | default false }}
spec:
  selector:
    matchLabels:
      {{- include "srsran-gnb.selectorLabels" . | nindent 6 }}
  replicas: 1
  template:
    metadata:
      labels:
        {{- include "srsran-gnb.selectorLabels" . | nindent 8 }}
      annotations:
        k8s.v1.cni.cncf.io/networks: >-
          [
            { "name": "{{ .Values.n3networkName }}", "interface": "n3", "ips": [ "{{ .Values.gnbIp }}/24" ] }
            {{- if .Values.ru }}
            ,{ "name": "ru-network", "interface": "ru1", "ips": [ "{{ .Values.ruPodIp }}/24" ] }
            {{- end }}
            {{- if $sriovEnabled }}
            ,{ "name": "benetel-dpdk-network", "interface": "{{ $sriov.name }}" }
            {{- end }}
          ]
    spec:
      containers:
        - name: gnb
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              ip route del default dev n3 || true
              {{- if .Values.usrp }}
              ip route add 192.168.235.0/24 dev usrp1 || true
              {{- end }}
              {{- if $sriovEnabled }}
              # Check VF SR-IOV
              VF_DEVICE=${PCIDEVICE_OPENSHIFT_IO_{{ $sriov.sriovResourceName | upper }}:-}
              if [ -z "$VF_DEVICE" ]; then
                echo "ERROR: VF non exposée dans le pod, abort"
                exit 1
              fi
              echo "VF ready: $VF_DEVICE"
              ls -l /dev/vfio
              # Prepare gNB config
              RESOLVED_CONFIG="/tmp/srsran-gnb.yaml"
              cp /srsran/config/srsran-gnb.yaml "$RESOLVED_CONFIG"
              PCI_ADDR="$VF_DEVICE"
              PCI_ADDR=$(echo $PCI_ADDR | cut -d',' -f1)
              echo "PCI address resolved: $PCI_ADDR"
              OLD_PCI=$(grep -oP '[0-9a-f]{4}:[0-9a-f]{2}:[0-9a-f]{2}\.[0-9]' "$RESOLVED_CONFIG" | head -1)
              sed -i "s|$OLD_PCI|$PCI_ADDR|g" "$RESOLVED_CONFIG"
              CONFIG_FILE="$RESOLVED_CONFIG"
              {{- else }}
              CONFIG_FILE="/srsran/config/srsran-gnb.yaml"
              {{- end }}
              {{- if .Values.start.gnb }}
              /usr/local/bin/gnb -c $CONFIG_FILE{{- if .Values.csi_logger_enabled }} --csi-logger-enabled --csi-logger-period-slots={{ .Values.csi_logger_period_slots }}{{- if .Values.csi_logger_all_subcarriers }} --csi-logger-all-subcarriers{{- end }}{{- end }}
              {{- else }}
              sleep infinity
              {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.gnbConfig.remote_control.port }}
              protocol: TCP
          securityContext:
            privileged: true
            capabilities:
              add: ["NET_ADMIN", "SYS_NICE", "IPC_LOCK"]
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "rm -rf /mnt/*_log.txt"]
          {{- if $sriovEnabled }}
          resources:
            requests:
              memory: "4Gi"
              hugepages-1Gi: "2Gi"
              openshift.io/{{ $sriov.sriovResourceName }}: "1"
            limits:
              memory: "4Gi"
              hugepages-1Gi: "2Gi"
              openshift.io/{{ $sriov.sriovResourceName }}: "1"
          {{- else }}
          {{- if .Values.resources.define}}
          resources:
            requests:
              memory: {{ .Values.resources.requests.tcpdump.memory | quote }}
              cpu: {{ .Values.resources.requests.tcpdump.cpu | quote }}
            limits:
              memory: {{ .Values.resources.limits.tcpdump.memory | quote }}
              cpu: {{ .Values.resources.limits.tcpdump.cpu | quote }}
          {{- end}}
          {{- end}}
          volumeMounts:
            - mountPath: /srsran/config
              name: gnb-volume
            - mountPath: /var/log/
              name: varlog
            - mountPath: /mnt/
              name: host-mount
            {{- if $sriovEnabled }}
            - mountPath: /dev/hugepages
              name: hugepages
            {{- end }}
        {{- if .Values.start.logs }}
        - name: gnb-logs
          image: busybox
          args: [/bin/sh, -c, 'while ! tail -f /var/log/gnb.log 2>/dev/null; do sleep 1 ; done']
          volumeMounts:
            - mountPath: /var/log/
              name: varlog
        {{- end }}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      {{- if .Values.nodeName }}
      nodeName: {{ .Values.nodeName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: gnb-volume
          configMap:
            name: gnb-configmap
            items:
              - key: srsran-gnb.yaml
                path: srsran-gnb.yaml
        - name: varlog
          emptyDir: {}
        - name: host-mount
          hostPath:
            path: /mnt/
            type: Directory
        {{- if $sriovEnabled }}
        - name: hugepages
          emptyDir:
            medium: HugePages-1Gi
        {{- end }}
